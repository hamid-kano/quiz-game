<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تحدّي المعرفة</title>
  <meta name="description" content="لعبة مسابقات ثقافية بالعربية">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <!-- شاشة البداية -->
    <section id="screen-start" class="screen active">
      <div class="logo">🧠</div>
      <h1>تحدّي المعرفة</h1>
      <p class="subtitle">اختر فئة وأجب عن 10 أسئلة قبل نفاد الوقت</p>

      <label class="field">
        <span>اسمك</span>
        <input id="player-name" type="text" maxlength="20" placeholder="مثلاً: حامد">
      </label>

      <div class="categories" id="categories"></div>

      <div class="difficulty">
        <button class="chip active" data-time="20">سهل · 20ث</button>
        <button class="chip" data-time="12">متوسط · 12ث</button>
        <button class="chip" data-time="7">صعب · 7ث</button>
      </div>

      <button id="btn-start" class="btn primary">ابدأ اللعب</button>

      <div class="leaderboard">
        <h3>🏆 أفضل النتائج</h3>
        <ol id="leaderboard-list"></ol>
      </div>
    </section>

    <!-- شاشة السؤال -->
    <section id="screen-quiz" class="screen">
      <header class="quiz-head">
        <span id="q-counter">1 / 10</span>
        <span id="q-score">⭐ 0</span>
        <span id="q-timer" class="timer">20</span>
      </header>
      <div class="progress"><div id="progress-bar"></div></div>
      <div class="time-bar"><div id="time-bar"></div></div>

      <h2 id="q-text" class="question"></h2>
      <div id="answers" class="answers"></div>

      <div class="helpers">
        <button id="btn-fifty" class="btn ghost">50:50</button>
        <button id="btn-skip" class="btn ghost">تخطّي</button>
      </div>
    </section>

    <!-- شاشة النتيجة -->
    <section id="screen-result" class="screen">
      <div class="logo" id="result-emoji">🎉</div>
      <h1 id="result-title">أحسنت!</h1>
      <p class="big-score"><span id="result-score">0</span> نقطة</p>
      <p id="result-detail" class="subtitle"></p>
      <div class="result-actions">
        <button id="btn-again" class="btn primary">العب مجدداً</button>
        <button id="btn-home" class="btn ghost">الرئيسية</button>
      </div>
      <div id="review" class="review"></div>
    </section>

  </main>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
